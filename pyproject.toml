[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes-agent"
version = "0.1.0"
description = "AI meeting-notes agent on a frozen speech-capable omni core (engineering scaffold)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
